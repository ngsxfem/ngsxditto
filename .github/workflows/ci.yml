name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          bash ci/install_base_deps.sh
          pip install pyvista
          pip install .

      - name: Fix MKL library compatibility
        run: bash ci/fix_mkl.sh

      - name: Verify import
        run: python -c "import ngsxditto"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          bash ci/install_base_deps.sh
          pip install -e .

      - name: Fix MKL library compatibility
        run: bash ci/fix_mkl.sh

      - name: Run tests
        run: bash ci/run_tests.sh

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/

  build-pages:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev libgl1 mesa-utils pandoc make
          # GL/X libs headless chromium's swiftshader-webgl path needs to initialize
          # (without these the WebGL canvas silently stays blank -- no error, just
          # an empty screenshot). xvfb is for pyvista/VTK below, which does open a
          # (virtual) display.
          sudo apt-get install -y --no-install-recommends libglu1-mesa libglx-mesa0 libgl1-mesa-dri libxrender1 xvfb
          # The webgui previews (ipython_startup/00-webgui-static.py) screenshot
          # each scene with a headless browser; the runner's preinstalled
          # google-chrome is used for that (Ubuntu's apt "chromium" is only a
          # snap shim -- do NOT install it, the script would pick it up first).
          google-chrome --version

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: htmlcov/

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          bash ci/install_base_deps.sh
          pip install .

      - name: Fix MKL library compatibility
        run: bash ci/fix_mkl.sh

      - name: Generate documentation
        env:
          PYVISTA_OFF_SCREEN: "true"
          VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN: "true"
          DISPLAY: ":99.0"
        run: |
          mkdir -p docs/htmlcov
          cp -r htmlcov/* docs/htmlcov/ || true
          # DISPLAY=:99.0 above is a lie unless something is actually listening there --
          # pyvista's Plotter(off_screen=True) opens it via GLX, so start a virtual
          # framebuffer server on it (otherwise VTK warns "bad X server connection").
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          cd docs
          ./generate_docs.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-package:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install .
          pip install build twine
          python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/

      - name: Note
        run: echo "Package built successfully, not uploading anywhere."
