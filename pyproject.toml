[project]
name = "ngsxditto"
version = "0.0.1"
description = "ngsxditto -- application framework for level-set based unfitted discretization"
authors = [{ name = "Christoph Lehrenfeld, Mika Meyer, Maximilian Zienecker", email = "lehrenfeld@math.uni-goettingen.de" }]
dependencies = [
    "ngsolve",
    "xfem>=2.1.2605.dev11",
    "alive-progress",
    "scipy"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ngsxditto*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
